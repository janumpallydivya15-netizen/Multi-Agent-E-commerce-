<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compare — Multi-Agent E-Commerce</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav-container"></div>
  <div class="page">
    <div class="section-header">
      <h1>⚖️ Compare Products</h1>
      <p>Side-by-side comparison of price, specifications, and requirement match.</p>
    </div>

    <div id="context-bar-wrap"></div>

    <!-- Product selection for compare -->
    <div class="card" style="margin-bottom:24px" id="select-card">
      <div class="card-title" style="margin-bottom:14px">Select products to compare</div>
      <div class="checkbox-list" id="product-checkboxes"></div>
      <div style="margin-top:16px">
        <button class="btn btn-primary" id="compareBtn" onclick="runComparison()" disabled>
          ⚖️ Run Comparison
        </button>
      </div>
    </div>

    <!-- Comparison Table -->
    <div id="compare-area"></div>

    <!-- Page Nav -->
    <div class="page-nav">
      <button class="btn btn-ghost" onclick="window.location.href='/pages/products.html'">← Back to Products</button>
      <button class="btn btn-primary btn-lg" onclick="window.location.href='/pages/recommendations.html'">
        Get Recommendations →
      </button>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/compare.js"></script>
</body>
</html>
