<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Requirements — Multi-Agent E-Commerce</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav-container"></div>
  <div class="page-sm">
    <div class="section-header">
      <h1>🧠 Understand Your Requirements</h1>
      <p>Tell us what you need and our Requirement Agent will extract your shopping preferences.</p>
    </div>

    <!-- Input Card -->
    <div class="card" style="margin-bottom:24px">
      <div class="form-group">
        <label class="form-label">Customer Request</label>
        <div class="form-sublabel">Describe what you want in plain language — budget, features, brand preferences, purpose.</div>
        <textarea id="requestInput" class="form-input" style="min-height:120px"
          placeholder="E.g. I want a smartphone under ₹40,000 for programming with 16GB RAM and good battery life."></textarea>
      </div>
      <div style="margin-top:16px;display:flex;gap:12px;flex-wrap:wrap">
        <button id="analyzeBtn" class="btn btn-primary btn-lg" onclick="analyzeRequirements()">
          🧠 Analyze Requirements
        </button>
        <button class="btn btn-ghost btn-lg" onclick="Session.clearAll();window.location.href='/'">← Home</button>
      </div>

      <!-- Quick examples -->
      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
        <div class="form-sublabel" style="margin-bottom:10px">Quick examples:</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" onclick="setExample(0)">📱 Smartphone ₹100k</button>
          <button class="btn btn-ghost btn-sm" onclick="setExample(1)">📱 Smartphone ₹40k</button>
          <button class="btn btn-ghost btn-sm" onclick="setExample(2)">💻 Laptop ₹70k</button>
          <button class="btn btn-ghost btn-sm" onclick="setExample(3)">🎧 Headphones</button>
        </div>
      </div>
    </div>

    <!-- Result Area -->
    <div id="result-area"></div>

    <!-- Page Nav -->
    <div id="page-nav" style="display:none" class="page-nav">
      <button class="btn btn-ghost" onclick="window.location.href='/'">← Home</button>
      <button class="btn btn-primary btn-lg" onclick="window.location.href='/pages/products.html'">
        Continue to Products →
      </button>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/requirements.js"></script>
</body>
</html>
